<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>URL Shortener</title>
  <style>
    body { font-family: sans-serif; max-width: 500px; margin: 60px auto; padding: 0 16px; }
    input { display: block; width: 100%; padding: 8px; margin-bottom: 10px; box-sizing: border-box; }
    button { padding: 8px 14px; cursor: pointer; }
    #result { margin-top: 20px; }
    .error { color: #c00; }
  </style>
</head>
<body>
  <h2>URL Shortener</h2>
  <input id="url" type="url" placeholder="Paste a long URL here" />
  <input id="alias" type="text" placeholder="Custom alias (optional)" />
  <input id="days" type="number" min="1" max="365" placeholder="Expires in days (optional)" />
  <button onclick="shorten()">Shorten</button>
  <div id="result"></div>

  <script>
    async function shorten() {
      const url = document.getElementById('url').value.trim();
      const alias = document.getElementById('alias').value.trim();
      const days = document.getElementById('days').value;
      const result = document.getElementById('result');

      const body = { url };
      if (alias) body.alias = alias;
      if (days) body.expiresInDays = Number(days);

      const res = await fetch('/api/shorten', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify(body),
      });
      const data = await res.json();

      if (!res.ok) {
        result.innerHTML = `<span class="error">${data.error}</span>`;
        return;
      }

      const expiry = data.expiresAt
        ? `<br><small>Expires: ${new Date(data.expiresAt).toLocaleString()}</small>`
        : '';
      result.innerHTML =
        `Short URL: <a href="${data.shortUrl}" target="_blank">${data.shortUrl}</a>${expiry}`;
    }
  </script>
</body>
</html>
